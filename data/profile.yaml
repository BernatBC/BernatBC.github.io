# A detailed summary about the user
bio: "I'm a Software Engineer at [OneSpan](https://www.onespan.com/), where I develop a mobile  cybersecurity SDK that protects applications against runtime threats and  other attacks. I work primarily with C/C++, building the core SDK, with  Kotlin, Swift, Flutter, and other technologies for cross-platform  integration.\n\nI'm interested in software engineering broadly, particularly systems  programming, cybersecurity, and building reliable developer-facing  products. I also enjoy competitive programming and solving algorithmic  problems.\n\nOutside of work, I explore AI and LLM applications, having built  several RAG systems involving vector databases, embedding pipelines, and  LLM orchestration. I also develop games with Unity for fun."